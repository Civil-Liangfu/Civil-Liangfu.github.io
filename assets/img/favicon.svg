<!-- Site icon (browser tab): an arch bridge in the site colours.
     favicon.png is made from this file; _config.yml `icon:` points to the PNG. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#14202e"/>
  <!-- arch -->
  <path d="M11 44 Q32 8 53 44" fill="none" stroke="#f08a4b" stroke-width="5" stroke-linecap="round"/>
  <!-- hangers -->
  <path d="M22 29.5 V44 M32 26 V44 M42 29.5 V44" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
  <!-- deck -->
  <path d="M7 44 H57" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
</svg>
