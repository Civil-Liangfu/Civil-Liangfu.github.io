    methods_and_tools:
      - label: Monitoring and sensing
        details: weigh-in-motion (WIM), machine vision, influence lines, Internet of Things (IoT)
      - label: Machine learning
        details: deep learning, object detection (YOLO), transfer learning, domain adaptation, generative adversarial networks, Gaussian process regression
      - label: Physics-informed modelling
        details: physics-informed neural networks, Fourier neural operators, vortex-induced vibration, operational modal analysis
      - label: Robotics and inspection
        details: ground robots, drones, forward-looking sonar
