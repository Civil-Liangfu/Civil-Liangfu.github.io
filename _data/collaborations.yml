  people: "Ir Prof. Yong Xia"
  coauthors:
    - "Xia, Yong"
  period: "2025–present"
  summary: "My current institution: Department of Civil and Environmental Engineering and the Guangdong-Hong Kong Joint Research Centre for Marine Infrastructure."
collaborations:
