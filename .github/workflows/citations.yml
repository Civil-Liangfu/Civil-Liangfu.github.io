name: Update publications and citations

# 1. bin/update_citations.py: adds papers that are new on my Google Scholar profile
#    to _bibliography/papers.bib, and saves the citation counts (Google Scholar
#    first, OpenAlex if Scholar blocks the request and the saved Scholar counts are
#    older than 60 days) to _data/citations.yml.
# 2. bin/update_coauthors.py: finds my co-authors' institutions on OpenAlex for the
#    collaboration map (_data/coauthor_network.yml).
# The "Deploy site" workflow then publishes the changes. Runs on Mondays and
# Thursdays, right after the publication list, the Scholar/ORCID IDs or the
# scripts change on main, and by hand from the Actions tab ("Run workflow"). On a
# pull request that changes the scripts it only tests them: the results are
# printed in the log and nothing is saved.
#
# The commit made every week also counts as repository activity, so GitHub does
# not switch this schedule off (it disables scheduled workflows after 60 days
# without commits).

on:
  schedule:
    - cron: "23 4 * * 1,4" # Mondays and Thursdays, 04:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "_bibliography/papers.bib"
      - "_data/socials.yml"
      - "bin/update_citations.py"
      - "bin/update_coauthors.py"
      - ".github/workflows/citations.yml"
  pull_request:
    paths:
      - "bin/update_citations.py"
      - "bin/update_coauthors.py"
      - ".github/workflows/citations.yml"

permissions:
  contents: write

# one update at a time (a new paper list and the Monday run could otherwise collide)
concurrency:
  group: citation-counts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # httpx 0.28 removed an option that scholarly 1.7.11 still uses
        run: pip install "scholarly==1.7.11" "httpx<0.28" "bibtexparser==1.4.3" pyyaml

      - name: Test new papers and citation counts (nothing is saved)
        if: github.event_name == 'pull_request'
        run: python bin/update_citations.py --dry-run --preview-new 2

      - name: Test co-author institutions (nothing is saved)
        if: github.event_name == 'pull_request'
        run: python bin/update_coauthors.py --dry-run

      - name: New papers and citation counts
        if: github.event_name != 'pull_request'
        run: python bin/update_citations.py

      - name: Co-author institutions
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: python bin/update_coauthors.py

      - name: Save to the repository
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib _data/citations.yml _data/scholar_sync.yml _data/coauthor_network.yml
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update publications and citations"
            git pull --rebase origin "$GITHUB_REF_NAME" # in case something was saved meanwhile
            git push
          fi
